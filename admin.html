<style>
  .admin-wrap{ max-width:900px; margin:0 auto; padding:32px 24px 80px; }
  .live-dot{ width:9px; height:9px; border-radius:50%; background:var(--success); display:inline-block; box-shadow:0 0 0 0 rgba(22,163,74,.6); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(22,163,74,.5); } 70%{ box-shadow:0 0 0 8px rgba(22,163,74,0); } 100%{ box-shadow:0 0 0 0 rgba(22,163,74,0); } }
  .order-new{ border-color:var(--violet) !important; box-shadow:0 0 0 3px var(--grad-warp-soft); }
  .order-stale{ border-color:var(--danger) !important; box-shadow:0 0 0 3px var(--danger-bg); animation:stalepulse 2s infinite; }
  @keyframes stalepulse{ 0%{ box-shadow:0 0 0 0 rgba(220,38,38,.4); } 70%{ box-shadow:0 0 0 8px rgba(220,38,38,0); } 100%{ box-shadow:0 0 0 0 rgba(220,38,38,0); } }
  .status-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }

  .status-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  #pinScreen{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:24px; }

  .drv-card{ padding:20px 22px; margin-bottom:14px; }
  .earn-row{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:5px 0; font-size:.9rem; }
  .earn-row small{ display:block; font-size:.74rem; color:var(--muted); }
  .earn-row b{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .earn-total{ font-size:1rem; font-weight:700; }

<body>

<div id="pinScreen">
  <div class="card" style="padding:36px;max-width:340px;width:100%;text-align:center;">
    <div style="font-size:2rem;margin-bottom:10px;">🔐</div>
    <h3>Owner Dashboard</h3>
    <p class="text-muted" style="font-size:.88rem;">Enter the owner PIN to view incoming orders.</p>
    <input type="password" id="pinInput" placeholder="PIN" style="text-align:center;letter-spacing:.2em;margin-bottom:14px;" autofocus>
    <button class="btn btn-primary btn-block" onclick="tryUnlock()">Unlock</button>
    <p class="hint" style="margin-top:14px;">Default PIN is <code>1234</code> — change ADMIN_PIN in this file before using this for real.</p>
  </div>
</div>

<div class="admin-wrap" id="dashboard" style="display:none;">
  <div class="row-between" style="margin-bottom:20px;flex-wrap:wrap;gap:12px;">
    <div>
      <h2 style="margin-bottom:4px;"><span class="live-dot"></span>&nbsp; Owner Dashboard</h2>
      <p class="text-muted mb-0" style="font-size:.85rem;">Checking for new orders every 5 seconds. Keep this tab open.</p>
    </div>
    <div class="flex gap-8" style="flex-wrap:wrap;">
      <a href="index.html" class="btn btn-ghost btn-sm">← WarpX site</a>
      <a href="driver.html" class="btn btn-ghost btn-sm">🚴 Driver Hub</a>
      <button class="btn btn-ghost btn-sm" onclick="toggleSound()"><span id="soundLabel">🔊 Sound on</span></button>
      <button class="btn btn-ghost btn-sm" onclick="requestNotifyPermission()"><span id="notifyLabel">🔔 Enable alerts</span></button>
      <button class="btn btn-outline btn-sm" onclick="refreshCurrentTab()">↻ Refresh now</button>
    </div>
  </div>

  <div class="segmented" id="mainTabs" style="margin-bottom:18px;">
    <button type="button" class="active" data-tab="orders">📦 Orders</button>
    <button type="button" data-tab="drivers">🚴 Drivers <span id="driverBadge" class="badge badge-lime" style="display:none;margin-left:4px;"></span></button>
    <button type="button" data-tab="earnings">💰 Earnings</button>
    <button type="button" data-tab="payouts">💸 Payouts</button>
  </div>

  <div id="ordersPanel">
    <div class="segmented service-filter" id="serviceFilter">
      <button type="button" class="active" data-val="all">All</button>
      <button type="button" data-val="food">🍽️ Food</button>
      <button type="button" data-val="grocery">🥬 Grocery</button>
      <button type="button" data-val="medicine">💊 Medicine</button>
      <button type="button" data-val="laundry">🧺 Laundry</button>
      <button type="button" data-val="anything">✨ Anything</button>
    </div>
    <div id="dueSoon"></div>
    <div id="ordersList"></div>
  </div>

  <div id="payoutsPanel" style="display:none;">
    <div id="payoutsBody"></div>
  </div>

  <div id="earningsPanel" style="display:none;">
    <div class="segmented service-filter" id="periodFilter">
      <button type="button" class="active" data-val="today">Today</button>
      <button type="button" data-val="week">Last 7 days</button>
      <button type="button" data-val="month">Last 30 days</button>
      <button type="button" data-val="all">All time</button>
    </div>
    <div id="earningsBody"></div>
  </div>

  <div id="driversPanel" style="display:none;">
    <div class="segmented service-filter" id="driverFilter">
      <button type="button" class="active" data-val="pending">Pending</button>
      <button type="button" data-val="approved">Approved</button>
      <button type="button" data-val="rejected">Rejected</button>
      <button type="button" data-val="all">All</button>
    </div>
    <div id="driversList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="lib/schedule.js"></script>
<script>
const ADMIN_PIN = "1234"; // change this before using this for anything real
const SEEN_KEY = "warpx_admin_seen_ids";
const SOUND_KEY = "warpx_admin_sound";
const STALE_MINUTES = 10;
let soundOn = localStorage.getItem(SOUND_KEY) !== "off";
let audioCtx = null;
let currentTab = "orders";
let serviceFilter = "all";
let driverFilter = "pending";

function tryUnlock() {
  const val = document.getElementById("pinInput").value;
  if (val === ADMIN_PIN) {
    sessionStorage.setItem("warpx_admin_unlocked", "1");
    unlockDashboard();
  } else {
    showToast("Wrong PIN.");
  }
}
document.getElementById("pinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

function unlockDashboard() {
  document.getElementById("pinScreen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  // Both the AudioContext and the notification permission prompt need a
  // genuine user gesture — this click is it. Doing this later (e.g. inside
  // the polling loop) gets silently blocked by browser autoplay/permission
  // policy, which is exactly the bug this priming avoids.
  primeAudio();
  if (window.Notification && Notification.permission === "default") {
    requestNotifyPermission();
  }
  updateNotifyLabel();
  startPolling();
}

function primeAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {}
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off");
  document.getElementById("soundLabel").textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off";
  if (soundOn) primeAudio();
}
document.getElementById("soundLabel").textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off";

function updateNotifyLabel() {
  const label = document.getElementById("notifyLabel");
  if (!window.Notification) { label.textContent = "🔕 Alerts unsupported"; return; }
  if (Notification.permission === "granted") label.textContent = "🔔 Alerts on";
  else if (Notification.permission === "denied") label.textContent = "🔕 Alerts blocked";
  else label.textContent = "🔔 Enable alerts";
}

function requestNotifyPermission() {
  if (!window.Notification) return showToast("This browser doesn't support desktop notifications.");
  if (Notification.permission === "granted") { updateNotifyLabel(); return; }
  Notification.requestPermission().then(() => updateNotifyLabel());
}

function notifyNewOrders(count) {
  if (!window.Notification || Notification.permission !== "granted") return;
  // A toast already covers the case where the owner is looking at the tab —
  // an OS notification is only useful (and not just noise) when they're not.
  if (!document.hidden) return;
  try {
    const n = new Notification("⚡ New WarpX order" + (count > 1 ? "s" : ""), {
      body: count > 1 ? `${count} new orders just came in.` : "A new order just came in.",
      tag: "warpx-new-order",
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (e) {}
}

function beep() {
  if (!soundOn || !audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  try {
    [880, 1180].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.16);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.16 + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.16);
      osc.stop(audioCtx.currentTime + i * 0.16 + 0.15);
    });
  } catch (e) {}
}

function getSeenIds() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); }
  catch (e) { return new Set(); }
}
function saveSeenIds(set) {
  localStorage.setItem(SEEN_KEY, JSON.stringify([...set]));
}

document.getElementById("mainTabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#mainTabs button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  document.getElementById("ordersPanel").style.display = currentTab === "orders" ? "block" : "none";
  document.getElementById("driversPanel").style.display = currentTab === "drivers" ? "block" : "none";
  document.getElementById("earningsPanel").style.display = currentTab === "earnings" ? "block" : "none";
  document.getElementById("payoutsPanel").style.display = currentTab === "payouts" ? "block" : "none";
  refreshCurrentTab();
});

document.getElementById("periodFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#periodFilter button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  earningsPeriod = btn.dataset.val;
  renderEarnings();
});

document.getElementById("serviceFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#serviceFilter button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  serviceFilter = btn.dataset.val;
  renderOrders(lastOrders);
});

document.getElementById("driverFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#driverFilter button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  driverFilter = btn.dataset.val;
  renderDrivers(lastDrivers);
});

function refreshCurrentTab() {
  if (currentTab === "orders") loadOrders(true);
  else if (currentTab === "earnings") loadEarnings();
  else if (currentTab === "payouts") loadPayouts();
  else loadDrivers(true);
}

/* ---- Earnings -----------------------------------------------------------
   Deliberately separates what customers paid from what WarpX keeps. Most of
   an order's subtotal is the cafe's or the shop's money passing through. */
let earningsPeriod = "today";
let lastEarnings = null;


/* ---- Driver payouts ------------------------------------------------------
   The earnings panel says what is owed in total; this says to whom, and lets
   it be marked settled. Owed is always recomputed server-side from delivered
   orders, so this ledger can never disagree with a driver's own hub. */
let lastPayouts = null;

async function loadPayouts() {
  try {
    const res = await fetch("/api/admin/payouts");
    if (!res.ok) throw new Error("failed");
    lastPayouts = await res.json();
    renderPayouts();
  } catch (e) {
    document.getElementById("payoutsBody").innerHTML =
      `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">🛰️</div><h3>Can't reach the server</h3><p class="text-muted mb-0">Payouts need the WarpX backend running.</p></div>`;
  }
}

function renderPayouts() {
  if (!lastPayouts) return;
  const { rows, outstanding, settled } = lastPayouts;
  const body = document.getElementById("payoutsBody");

  if (!rows.length) {
    body.innerHTML = `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">💸</div><h3>Nothing to pay yet</h3><p class="text-muted mb-0">Rows appear here once a driver completes a delivery.</p></div>`;
    return;
  }

  // Grouped by driver: settling up is a per-person conversation, not a
  // chronological one.
  const byDriver = new Map();
  for (const r of rows) {
    if (!byDriver.has(r.driverId)) byDriver.set(r.driverId, { name: r.driverName, phone: r.driverPhone, days: [] });
    byDriver.get(r.driverId).days.push(r);
  }

  body.innerHTML = `
    <div class="grid grid-2" style="gap:16px;margin-bottom:16px;">
      <div class="card" style="padding:22px;">
        <span class="text-muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;">Still owed</span>
        <div style="font-size:1.9rem;font-weight:800;">${money(outstanding)}</div>
      </div>
      <div class="card" style="padding:22px;">
        <span class="text-muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;">Already paid</span>
        <div style="font-size:1.9rem;font-weight:800;" class="text-muted">${money(settled)}</div>
      </div>
    </div>
    ${[...byDriver.entries()].map(([id, d]) => {
      const owed = d.days.filter((x) => !x.paid).reduce((s, x) => s + x.amount, 0);
      return `
      <div class="card" style="padding:22px;margin-bottom:14px;">
        <div class="row-between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">
          <div><b>${esc(d.name)}</b> <span class="text-muted" style="font-size:.82rem;">${esc(d.phone)}</span></div>
          <div style="font-weight:700;">${owed > 0 ? money(owed) + " owed" : `<span class="text-muted">all settled</span>`}</div>
        </div>
        ${d.days.map((r) => `
          <div class="payout-row">
            <div class="payout-who">
              <b>${esc(r.day)}</b>
              <small>${r.deliveries} ${r.deliveries === 1 ? "delivery" : "deliveries"} · tier ${r.tier} (${r.percent}%) · ₹${r.base} base + ₹${r.bonus} bonus</small>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="payout-amt ${r.paid ? "payout-paid" : ""}">${money(r.amount)}</span>
              ${r.paid
                ? `<button class="btn btn-ghost btn-sm" onclick="undoPayout(${r.payoutId})" title="Recorded ${esc(r.paidAt || "")}">✓ Paid · undo</button>`
                : `<button class="btn btn-primary btn-sm" onclick="markPaid(${r.driverId}, '${esc(r.day)}')">Mark paid</button>`}
            </div>
          </div>`).join("")}
      </div>`;
    }).join("")}`;
}

async function markPaid(driverId, day) {
  try {
    const res = await fetch("/api/admin/payouts", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driverId, day }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not record that payout.");
    showToast(`Marked ${money(data.paidAmount)} paid.`);
    loadPayouts();
  } catch (e) { showToast(e.message); }
}

async function undoPayout(id) {
  if (!confirm("Undo this payout record? It goes back to unpaid.")) return;
  try {
    const res = await fetch(`/api/admin/payouts/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("Could not undo that.");
    showToast("Payout record removed.");
    loadPayouts();
  } catch (e) { showToast(e.message); }
}

async function loadEarnings() {
  try {
    const res = await fetch("/api/admin/earnings");
    if (!res.ok) throw new Error("failed");
    lastEarnings = await res.json();
    renderEarnings();
  } catch (e) {
    document.getElementById("earningsBody").innerHTML =
      `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">🛰️</div><h3>Can't reach the server</h3><p class="text-muted mb-0">The WarpX backend needs to be running for earnings.</p></div>`;
  }
}

const money = (n) => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });

function renderEarnings() {
  if (!lastEarnings) return;
  const d = lastEarnings[earningsPeriod];
  const label = { today: "today", week: "in the last 7 days", month: "in the last 30 days", all: "all time" }[earningsPeriod];
  const marginPct = d.revenue ? Math.round((d.net / d.revenue) * 100) : 0;

  document.getElementById("earningsBody").innerHTML = `
    <div class="card" style="padding:26px;margin-bottom:16px;">
      <span class="text-muted" style="font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;">What WarpX kept ${esc(label)}</span>
      <div style="font-size:2.4rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;">${money(d.net)}</div>
      <p class="text-muted mb-0" style="font-size:.86rem;">
        from ${d.orders} order${d.orders === 1 ? "" : "s"} · ${money(d.gross)} collected from customers ·
        ${marginPct}% of WarpX revenue kept after driver pay
      </p>
    </div>

    <div class="grid grid-2" style="gap:16px;margin-bottom:16px;">
      <div class="card" style="padding:22px;">
        <h3 style="margin:0 0 12px;font-size:1rem;">Money in</h3>
        <div class="earn-row"><span>Delivery fees</span><b>${money(d.deliveryFees)}</b></div>
        <div class="earn-row"><span>Food margin <small>₹${lastEarnings.foodMarginPerItem}/item on cafe orders</small></span><b>${money(d.foodMargin)}</b></div>
        <div class="divider" style="margin:10px 0;"></div>
        <div class="earn-row earn-total"><span>WarpX revenue</span><b>${money(d.revenue)}</b></div>
      </div>
      <div class="card" style="padding:22px;">
        <h3 style="margin:0 0 12px;font-size:1rem;">Money out</h3>
        <div class="earn-row"><span>Driver pay <small>${d.deliveries} deliveries, base + tier bonus</small></span><b>${money(d.driverPay)}</b></div>
        <div class="earn-row"><span class="text-muted">Goods cost <small>paid to the cafe / shop</small></span><b class="text-muted">${money(d.goods - d.foodMargin)}</b></div>
        <div class="divider" style="margin:10px 0;"></div>
        <div class="earn-row earn-total"><span>Net kept</span><b>${money(d.net)}</b></div>
      </div>
    </div>

    <div class="card" style="padding:22px;">
      <h3 style="margin:0 0 10px;font-size:1rem;">How this is worked out</h3>
      <p class="text-muted" style="font-size:.87rem;line-height:1.6;margin:0 0 10px;">
        Customers paid <b>${money(d.gross)}</b>, but most of that isn't yours — <b>${money(d.goods - d.foodMargin)}</b> of it is
        the cafe's and the shops' money passing through. What WarpX actually earns is the
        <b>delivery fee</b> on every order plus the <b>₹${lastEarnings.foodMarginPerItem} per item</b> built into Picasso Cafe's listed prices.
      </p>
      <p class="text-muted" style="font-size:.87rem;line-height:1.6;margin:0;">
        Driver pay comes out of that: ₹${lastEarnings.basePerDelivery} base per delivery plus each driver's end-of-day
        tier percentage of the fees they collected. It's settled per driver per day, the same way the Driver Hub shows it,
        because the tier a driver finishes on pays for their whole day.
      </p>
    </div>`;
}

const STATUS_STEPS = ["placed", "preparing", "out for delivery", "delivered"];
let firstOrderLoad = true;
let lastOrders = [];

function minutesAgo(sqliteDatetime) {
  // SQLite's datetime('now') is UTC with a space separator — normalize to
  // an ISO string so Date() doesn't (incorrectly) parse it as local time.
  const iso = sqliteDatetime.replace(" ", "T") + "Z";
  return (Date.now() - new Date(iso).getTime()) / 60000;
}

async function loadOrders(manual) {
  try {
    const res = await fetch("/api/orders");
    if (!res.ok) throw new Error("failed");
    const orders = await res.json();
    lastOrders = orders;

    const seen = getSeenIds();
    const newOnes = orders.filter((o) => !seen.has(o.id));

    if (!firstOrderLoad && newOnes.length > 0) {
      beep();
      showToast(`⚡ ${newOnes.length} new order${newOnes.length > 1 ? "s" : ""} just came in!`);
      notifyNewOrders(newOnes.length);
    }

    orders.forEach((o) => seen.add(o.id));
    saveSeenIds(seen);

    alertDueSoon(orders);
    firstOrderLoad = false;

    renderOrders(orders);
  } catch (err) {
    // Never leave the dashboard silently blank — that's indistinguishable
    // from "broken". Only replace a list that's showing real orders once
    // we've actually loaded something; a transient poll failure shouldn't
    // wipe out data already on screen.
    if (firstOrderLoad) {
      document.getElementById("ordersList").innerHTML = `
        <div class="card center" style="padding:48px 24px;">
          <div style="font-size:2rem;margin-bottom:10px;">🛰️</div>
          <h3>Can't reach the server</h3>
          <p class="text-muted mb-0">Make sure the WarpX backend is actually running (<code>npm start</code>, or double-click your start script) — this page needs it, a plain static file server isn't enough.</p>
        </div>`;
    }
    if (manual) showToast("Could not reach the server.");
  }
}


/* ---- Scheduled orders coming due -----------------------------------------
   Scheduling was shipped without this, which meant a 7pm delivery sat on the
   dashboard wearing a 🗓️ tag and nothing ever told the owner to start it. An
   order nobody is reminded about is an order that gets missed. Fires once per
   order, at the same moment it becomes claimable by a driver. */
const DUE_KEY = "warpx_admin_alerted_due";

function getAlertedIds() {
  try { return new Set(JSON.parse(localStorage.getItem(DUE_KEY)) || []); }
  catch (e) { return new Set(); }
}
function saveAlertedIds(set) {
  try { localStorage.setItem(DUE_KEY, JSON.stringify([...set].slice(-500))); } catch (e) {}
}

function minutesUntilSlot(value) {
  const when = parseSchedule(value);
  return when ? (when.getTime() - Date.now()) / 60000 : null;
}

function dueSoonOrders(orders) {
  return orders.filter((o) => {
    if (!o.scheduled_for || o.status === "delivered") return false;
    const mins = minutesUntilSlot(o.scheduled_for);
    return mins !== null && mins <= DISPATCH_LEAD_MINUTES;
  });
}

function alertDueSoon(orders) {
  const due = dueSoonOrders(orders);
  renderDueSoon(due);
  if (firstOrderLoad) return; // don't shout about history on first paint

  const alerted = getAlertedIds();
  const fresh = due.filter((o) => !alerted.has(o.id));
  if (fresh.length === 0) return;

  beep();
  const first = fresh[0];
  showToast(`🗓️ Prep now: #${first.order_number} due ${formatSchedule(first.scheduled_for)}`);
  if (window.Notification && Notification.permission === "granted") {
    new Notification(fresh.length > 1 ? `🗓️ ${fresh.length} scheduled orders due soon` : "🗓️ Scheduled order due soon", {
      body: fresh.length > 1
        ? fresh.map((o) => `#${o.order_number} — ${formatSchedule(o.scheduled_for)}`).join("\n")
        : `#${first.order_number} is due ${formatSchedule(first.scheduled_for)}. Time to start it.`,
      tag: "warpx-due-" + first.id,
    });
  }
  fresh.forEach((o) => alerted.add(o.id));
  saveAlertedIds(alerted);
}

function renderDueSoon(due) {
  const box = document.getElementById("dueSoon");
  if (!box) return;
  if (!due.length) { box.innerHTML = ""; return; }
  box.innerHTML = `
    <div class="card" style="padding:18px 20px;margin-bottom:16px;border:1px solid var(--violet);background:var(--grad-warp-soft);">
      <b style="display:block;margin-bottom:6px;">🗓️ Due soon — start these now</b>
      ${due.map((o) => `
        <div class="row-between" style="padding:5px 0;font-size:.9rem;flex-wrap:wrap;gap:8px;">
          <span><b>#${esc(o.order_number)}</b> · ${esc(o.customer_name || "customer")} · ${o.items.length} item${o.items.length===1?"":"s"}</span>
          <span style="font-weight:700;">${esc(formatSchedule(o.scheduled_for))}</span>
        </div>`).join("")}
    </div>`;
}

function renderOrders(orders) {
  const seen = getSeenIds();
  const list = document.getElementById("ordersList");
  const filtered = serviceFilter === "all"
    ? orders
    : orders.filter((o) => o.items.some((it) => it.service === serviceFilter));

  if (orders.length === 0) {
    list.innerHTML = `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">📭</div><h3>No orders yet</h3><p class="text-muted mb-0">They'll show up here the moment someone checks out.</p></div>`;
    return;
  }
  if (filtered.length === 0) {
    list.innerHTML = `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">🔍</div><h3>No orders in this category</h3><p class="text-muted mb-0">Try a different filter above.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map((o) => {
    const age = minutesAgo(o.created_at);
    const isStale = o.status === "placed" && age > STALE_MINUTES;
    return `
      <div class="card ${!seen.has(o.id) ? "order-new" : ""} ${isStale ? "order-stale" : ""}" style="padding:22px;margin-bottom:16px;">
        <div class="row-between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">
          <div>
            <b>#${esc(o.order_number)}</b> ${!seen.has(o.id) ? '<span class="badge badge-lime">NEW</span>' : ""}
            ${isStale ? `<span class="stale-tag">⚠ Unacknowledged ${Math.floor(age)} min</span>` : ""}
            <div class="text-muted" style="font-size:.8rem;">${esc(o.created_at)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700;">${esc(o.customer_name || "Guest")}</div>
            <div class="text-muted" style="font-size:.85rem;">${esc(o.customer_phone || "no phone on file")}</div>
          </div>
        </div>
        <div style="margin:10px 0;">
          ${o.items.map((it) => `
            <div class="row-between" style="font-size:.9rem;padding:3px 0;">
              <span>${it.qty} × ${esc(it.name)}${it.note ? ` <span class="text-muted">(${esc(it.note)})</span>` : ""}</span>
              <span>${it.price != null ? "₹" + (it.price * it.qty) : "TBC"}</span>
            </div>`).join("")}
        </div>
        <div class="row-between" style="font-weight:700;font-size:.95rem;">
          <span>Total (₹${o.delivery_fee} delivery incl.)</span>
          <span>₹${o.total}</span>
        </div>
        <div class="text-muted" style="font-size:.8rem;margin-top:4px;">
          ${o.payment_method === "upi" ? "📱 UPI" + (o.upi_id ? " (" + esc(o.upi_id) + ")" : "") : "💵 Cash on Delivery"}
          · ${o.driver_name ? "🚴 " + esc(o.driver_name) : "🚴 no driver yet"}
        </div>
        <div class="row-between" style="margin-top:8px;flex-wrap:wrap;gap:8px;align-items:center;">
          ${o.lat != null && o.lng != null ? `
            <a class="btn btn-outline btn-sm" href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}" target="_blank" rel="noopener">📍 Navigate to customer</a>
            <span class="text-muted" style="font-size:.78rem;">${o.scheduled_for ? `<span class="sched-tag">🗓️ ${esc(formatSchedule(o.scheduled_for))}</span> · ` : ""}${o.address_label ? "<b>" + esc(o.address_label) + "</b> · " : ""}${esc(o.address) || "No landmark note"} · ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</span>
          ` : `<span class="stale-tag" style="color:var(--warn);">⚠ No location on file for this order</span>`}
        </div>
        <div class="status-row">
          ${STATUS_STEPS.map((s) => `<button class="status-btn ${o.status === s ? "active" : ""}" onclick="setStatus(${o.id},'${s}')">${s}</button>`).join("")}
        </div>
      </div>
    `;
  }).join("");
}

async function setStatus(orderId, status) {
  try {
    await fetch(`/api/orders/${orderId}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    loadOrders();
  } catch (e) {
    showToast("Could not update status.");
  }
}

let firstDriverLoad = true;
let lastDrivers = [];

async function loadDrivers(manual) {
  try {
    const res = await fetch("/api/drivers");
    if (!res.ok) throw new Error("failed");
    const drivers = await res.json();
    lastDrivers = drivers;
    firstDriverLoad = false;

    const pendingCount = drivers.filter((d) => d.status === "pending").length;
    const badge = document.getElementById("driverBadge");
    if (pendingCount > 0) { badge.style.display = "inline-flex"; badge.textContent = pendingCount; }
    else { badge.style.display = "none"; }

    renderDrivers(drivers);
  } catch (err) {
    if (firstDriverLoad) {
      document.getElementById("driversList").innerHTML = `
        <div class="card center" style="padding:48px 24px;">
          <div style="font-size:2rem;margin-bottom:10px;">🛰️</div>
          <h3>Can't reach the server</h3>
          <p class="text-muted mb-0">Make sure the WarpX backend is running — this needs it too.</p>
        </div>`;
    }
    if (manual) showToast("Could not reach the server.");
  }
}

function renderDrivers(drivers) {
  const list = document.getElementById("driversList");
  const filtered = driverFilter === "all" ? drivers : drivers.filter((d) => d.status === driverFilter);

  if (drivers.length === 0) {
    list.innerHTML = `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">🚴</div><h3>No applications yet</h3><p class="text-muted mb-0">Driver applications from careers.html will show up here.</p></div>`;
    return;
  }
  if (filtered.length === 0) {
    list.innerHTML = `<div class="card center" style="padding:48px 24px;"><div style="font-size:2rem;margin-bottom:10px;">🔍</div><h3>Nothing here</h3><p class="text-muted mb-0">Try a different filter above.</p></div>`;
    return;
  }

  const statusBadge = { pending: "badge-warn", approved: "badge-success", rejected: "badge-danger" };

  list.innerHTML = filtered.map((d) => `
    <div class="card drv-card">
      <div class="row-between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">
        <div>
          <b>${esc(d.name)}</b>
          <span class="badge ${statusBadge[d.status] || "badge-muted"}" style="margin-left:6px;">${esc(d.status)}</span>
          <div class="text-muted" style="font-size:.82rem;">${esc(d.created_at)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:600;">${esc(d.phone)}</div>
          <div class="text-muted" style="font-size:.85rem;">${esc(d.vehicle_type)}${d.availability ? " · " + esc(d.availability) : ""}</div>
        </div>
      </div>
      ${d.google_sub ? `
        <div class="row-between" style="font-size:.85rem;margin-bottom:6px;gap:10px;flex-wrap:wrap;">
          <span class="text-muted">🔗 Google account: <b>${esc(d.email || "linked")}</b></span>
          <button class="btn btn-ghost btn-sm" onclick="unlinkDriverGoogle(${d.id})">Unlink</button>
        </div>` : ""}
      ${d.area ? `<div style="font-size:.9rem;margin-bottom:4px;"><b>Area:</b> ${esc(d.area)}</div>` : ""}
      ${d.notes ? `<div class="text-muted" style="font-size:.85rem;margin-bottom:8px;">${esc(d.notes)}</div>` : ""}
      <div class="status-row">
        <button class="status-btn ${d.status === "approved" ? "active" : ""}" onclick="setDriverStatus(${d.id},'approved')">✅ Approve</button>
        <button class="status-btn ${d.status === "rejected" ? "active" : ""}" onclick="setDriverStatus(${d.id},'rejected')">❌ Reject</button>
        <button class="status-btn ${d.status === "pending" ? "active" : ""}" onclick="setDriverStatus(${d.id},'pending')">↺ Back to pending</button>
      </div>
    </div>
  `).join("");
}

/* Linking a driver's Google account is keyed to the phone they applied with,
   which is first-come — so the owner needs a way to undo a wrong link. */
async function unlinkDriverGoogle(id) {
  if (!confirm("Unlink this driver's Google account? They'll have to link it again next time they sign in.")) return;
  try {
    const res = await fetch(`/api/drivers/${id}/google`, { method: "DELETE" });
    if (!res.ok) throw new Error("Could not unlink that account.");
    showToast("Google account unlinked.");
    loadDrivers(true);
  } catch (e) { showToast(e.message); }
}

async function setDriverStatus(id, status) {
  try {
    await fetch(`/api/drivers/${id}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    loadDrivers();
  } catch (e) {
    showToast("Could not update application.");
  }
}

function esc(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

let pollTimer;
function startPolling() {
  loadOrders();
  loadDrivers();
  pollTimer = setInterval(() => {
    loadOrders();
    loadDrivers();
  }, 5000);
}

// Stay unlocked for the rest of this browser tab session.
if (sessionStorage.getItem("warpx_admin_unlocked") === "1") {
  unlockDashboard();
}
</script>
<script src="/js/pwa.js"></script>
</body>
