<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<title>Driver Hub | WarpX</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<style>
  .drv-wrap{ max-width:820px; margin:0 auto; padding:28px 24px 80px; }
  #signInScreen{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:24px; }

  /* progress bar — fills toward the 50% cap */
  .prog-card{ padding:26px; margin-bottom:22px; background:var(--grad-warp); color:#fff; border:none; }
  .prog-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .prog-pct{ font-family:var(--font-head); font-weight:700; font-size:3rem; line-height:1; }
  .prog-pct small{ font-size:1.1rem; opacity:.7; margin-left:2px; }
  .prog-meta{ text-align:right; font-size:.85rem; color:rgba(255,255,255,.78); }
  .prog-track{
    position:relative; height:14px; border-radius:999px;
    background:rgba(255,255,255,.22); overflow:hidden;
  }
  .prog-fill{
    height:100%; border-radius:999px; width:0;
    background:linear-gradient(90deg,var(--lime),#8FE04A);
    transition:width .9s cubic-bezier(.16,.84,.44,1);
  }
  .prog-ticks{ position:relative; height:34px; margin-top:8px; }
  .prog-tick{ position:absolute; transform:translateX(-50%); text-align:center; font-size:.72rem; color:rgba(255,255,255,.65); }
  .prog-tick.done{ color:var(--lime); font-weight:700; }
  .prog-tick i{ display:block; width:2px; height:7px; background:currentColor; margin:0 auto 4px; border-radius:2px; opacity:.8; }
  .prog-goal{ color:#fff; font-weight:700; }

  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .stat-box{ padding:16px 18px; }
  .stat-box b{ display:block; font-family:var(--font-head); font-size:1.5rem; }
  .stat-box span{ font-size:.78rem; color:var(--muted); }
  @media (max-width:600px){ .stat-row{ grid-template-columns:1fr; } }

  .job{ padding:18px 20px; margin-bottom:12px; }
  .job-head{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .job-items{ font-size:.88rem; color:var(--ink-soft); margin:8px 0; }
  .job-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .otp-entry{ width:100%; margin-top:4px; }
  .otp-entry label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .otp-entry-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .otp-entry-row input{
    width:110px; flex:0 0 auto; text-align:center; letter-spacing:.3em; text-indent:.3em;
    font-family:var(--font-head); font-weight:700; font-size:1.1rem; padding:9px 12px;
  }
  .sec-head{ display:flex; align-items:center; gap:10px; margin:28px 0 14px; }
  .sec-head h3{ margin:0; }
  .sec-head .line{ flex:1; height:1px; background:var(--line); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">W</span>WarpX</a>
    <div class="nav-actions">
      <span class="badge badge-muted" id="navDriverName" style="display:none;"></span>
      <button class="btn btn-ghost btn-sm" id="signOutBtn" onclick="signOut()" style="display:none;">Sign out</button>
    </div>
  </div>
</nav>

<!-- ---------- sign in ---------- -->
<div id="signInScreen">
  <div class="card" style="padding:36px;max-width:380px;width:100%;">
    <div class="center" style="margin-bottom:20px;">
      <div style="font-size:2rem;">🚴</div>
      <h3 style="margin-bottom:4px;">Driver Hub</h3>
      <p class="text-muted mb-0" style="font-size:.88rem;">Sign in with the mobile number you applied with.</p>
    </div>
    <div class="field">
      <label for="drvPhone">Mobile number</label>
      <input type="tel" id="drvPhone" placeholder="10-digit mobile number">
    </div>
    <button class="btn btn-primary btn-block" onclick="signIn(this)">Sign in</button>
    <p class="hint" style="margin-top:14px;text-align:center;">
      Not signed up yet? <a href="careers.html" style="color:var(--violet);font-weight:600;">Apply to deliver →</a>
    </p>
  </div>
</div>

<!-- ---------- dashboard ---------- -->
<div class="drv-wrap" id="dashboard" style="display:none;">

  <div class="card prog-card">
    <div class="prog-top">
      <div>
        <div class="prog-pct"><span id="progPct">5</span><small>%</small></div>
        <div style="font-size:.85rem;color:rgba(255,255,255,.78);" id="progTierLabel">Tier 1 of 5</div>
      </div>
      <div class="prog-meta" id="progMeta"></div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-ticks" id="progTicks"></div>
  </div>

  <div class="stat-row">
    <div class="card stat-box"><b id="statCompleted">0</b><span>Deliveries completed</span></div>
    <div class="card stat-box"><b id="statActive">0</b><span>On the way now</span></div>
    <div class="card stat-box"><b id="statAvailable">0</b><span>Waiting to be picked up</span></div>
  </div>

  <div class="sec-head">
    <h3>Your deliveries</h3>
    <div class="line"></div>
    <button class="btn btn-ghost btn-sm" onclick="refresh(true)">↻ Refresh</button>
  </div>
  <div id="activeList"></div>

  <div class="sec-head">
    <h3>Available orders</h3>
    <div class="line"></div>
  </div>
  <div id="availableList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const DRIVER_KEY = "warpx_driver";

function esc(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

function getDriver() {
  try { return JSON.parse(localStorage.getItem(DRIVER_KEY)); }
  catch (e) { return null; }
}

async function signIn(btn) {
  const phone = document.getElementById("drvPhone").value.trim();
  if (!phone) return showToast("Enter your mobile number.");

  btn.disabled = true;
  btn.textContent = "Signing in...";
  try {
    const res = await fetch("/api/drivers/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();
    if (!res.ok) return showToast(data.error || "Could not sign in.");
    localStorage.setItem(DRIVER_KEY, JSON.stringify(data));
    openDashboard();
  } catch (e) {
    showToast("Could not reach the server — is the WarpX backend running?");
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
}

function signOut() {
  localStorage.removeItem(DRIVER_KEY);
  window.location.reload();
}

function openDashboard() {
  const driver = getDriver();
  if (!driver) return;
  document.getElementById("signInScreen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  const nameBadge = document.getElementById("navDriverName");
  nameBadge.textContent = "🚴 " + driver.name;
  nameBadge.style.display = "inline-flex";
  document.getElementById("signOutBtn").style.display = "inline-flex";
  refresh();
  setInterval(refresh, 10000);
}

function renderProgress(p) {
  document.getElementById("progPct").textContent = p.percent;
  document.getElementById("progTierLabel").textContent = `Tier ${p.tier} of ${p.tiers}`;
  // The track runs 0 → the 50% goal, so 45% very nearly fills it.
  document.getElementById("progFill").style.width = (p.percent / p.goal) * 100 + "%";
  document.getElementById("progMeta").innerHTML = p.atMax
    ? `<b>Top tier reached 🎉</b><br>${p.completed} deliveries completed`
    : `<b>${p.ordersToNext} more ${p.ordersToNext === 1 ? "delivery" : "deliveries"}</b><br>to reach ${p.nextPercent}%`;

  document.getElementById("progTicks").innerHTML = p.ladder
    .map((val) => `
      <div class="prog-tick ${val <= p.percent ? "done" : ""}" style="left:${(val / p.goal) * 100}%;">
        <i></i>${val}%
      </div>`)
    .join("") +
    `<div class="prog-tick prog-goal" style="left:100%;"><i></i>${p.goal}%</div>`;
}

function orderCard(o, action) {
  const items = o.items.map((it) => `${it.qty} × ${esc(it.name)}`).join(", ");
  const maps = o.lat != null && o.lng != null
    ? `<a class="btn btn-outline btn-sm" href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}" target="_blank" rel="noopener">📍 Navigate</a>`
    : "";
  return `
    <div class="card job">
      <div class="job-head">
        <div>
          <b>#${esc(o.order_number)}</b>
          <div class="text-muted" style="font-size:.8rem;">${esc(o.created_at)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;">₹${o.total}</div>
          <div class="text-muted" style="font-size:.8rem;">
            ${o.payment_method === "upi" ? "📱 UPI — already settled" : "💵 Collect ₹" + o.total + " cash"}
          </div>
        </div>
      </div>
      <div class="job-items">${items}</div>
      <div class="text-muted" style="font-size:.82rem;">${esc(o.address) || "No landmark note given"}</div>
      <div class="job-actions">${maps}${action}</div>
    </div>`;
}

let lastAvailableCount = 0;

async function refresh(manual) {
  const driver = getDriver();
  if (!driver) return;
  try {
    const [sumRes, availRes] = await Promise.all([
      fetch(`/api/drivers/${driver.id}/summary`),
      fetch("/api/orders/available"),
    ]);
    if (!sumRes.ok || !availRes.ok) throw new Error("failed");
    const summary = await sumRes.json();
    const available = await availRes.json();

    renderProgress(summary.progress);
    document.getElementById("statCompleted").textContent = summary.progress.completed;
    document.getElementById("statActive").textContent = summary.active.length;
    document.getElementById("statAvailable").textContent = available.length;

    // This list re-renders every 10 seconds. Without carrying the typed
    // digits (and the focus) across the re-render, a driver mid-way through
    // entering a code would watch it vanish under them.
    const typedOtps = {};
    let focusedOtpId = null;
    document.querySelectorAll("#activeList input[id^='otp-']").forEach((el) => {
      if (el.value) typedOtps[el.id] = el.value;
      if (document.activeElement === el) focusedOtpId = el.id;
    });

    document.getElementById("activeList").innerHTML = summary.active.length
      ? summary.active
          .map((o) => orderCard(o, `
            <div class="otp-entry">
              <label for="otp-${o.id}">Ask the customer for their 4-digit delivery code</label>
              <div class="otp-entry-row">
                <input type="text" id="otp-${o.id}" inputmode="numeric" maxlength="4" placeholder="0000"
                       onkeydown="if(event.key==='Enter')markDelivered(${o.id}, this.parentElement.querySelector('button'))">
                <button class="btn btn-primary btn-sm" onclick="markDelivered(${o.id}, this)">✓ Complete delivery</button>
              </div>
            </div>`))
          .join("")
      : `<div class="card center" style="padding:36px 22px;"><div style="font-size:1.8rem;margin-bottom:8px;">📭</div><p class="text-muted mb-0">Nothing on the way right now — accept an order below.</p></div>`;

    Object.entries(typedOtps).forEach(([id, value]) => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    });
    if (focusedOtpId) document.getElementById(focusedOtpId)?.focus();

    document.getElementById("availableList").innerHTML = available.length
      ? available
          .map((o) => orderCard(o, `<button class="btn btn-primary btn-sm" onclick="claimOrder(${o.id}, this)">Accept delivery</button>`))
          .join("")
      : `<div class="card center" style="padding:36px 22px;"><div style="font-size:1.8rem;margin-bottom:8px;">☕</div><p class="text-muted mb-0">No orders waiting. This list checks itself every 10 seconds.</p></div>`;

    if (!manual && available.length > lastAvailableCount && lastAvailableCount !== 0) {
      showToast("⚡ A new order just came in!");
    }
    lastAvailableCount = available.length;
  } catch (e) {
    if (manual) showToast("Could not reach the server.");
  }
}

async function claimOrder(orderId, btn) {
  const driver = getDriver();
  btn.disabled = true;
  btn.textContent = "Accepting...";
  try {
    const res = await fetch(`/api/orders/${orderId}/claim`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driverId: driver.id }),
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.error || "Could not accept that order.");
      return;
    }
    showToast("Order accepted — it's yours.");
  } catch (e) {
    showToast("Could not reach the server.");
  } finally {
    refresh(true);
  }
}

async function markDelivered(orderId, btn) {
  const driver = getDriver();
  const input = document.getElementById("otp-" + orderId);
  const otp = input ? input.value.trim() : "";
  if (!otp) {
    if (input) input.focus();
    return showToast("Ask the customer for their 4-digit delivery code.");
  }

  btn.disabled = true;
  btn.textContent = "Checking...";
  try {
    const res = await fetch(`/api/orders/${orderId}/deliver`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driverId: driver.id, otp }),
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.error || "Could not update that order.");
      // Leave the wrong code on screen so they can correct a typo rather
      // than retype the whole thing.
      btn.disabled = false;
      btn.textContent = "✓ Complete delivery";
      if (input) input.focus();
      return;
    }
    showToast(
      data.progress.atMax
        ? "Delivered! You're at the top tier 🎉"
        : `Delivered! ${data.progress.ordersToNext} more to reach ${data.progress.nextPercent}%.`
    );
    refresh(true); // only on success — a failed attempt keeps the typed code
  } catch (e) {
    showToast("Could not reach the server.");
    btn.disabled = false;
    btn.textContent = "✓ Complete delivery";
  }
}

document.getElementById("drvPhone").addEventListener("keydown", (e) => {
  if (e.key === "Enter") signIn(document.querySelector("#signInScreen .btn-primary"));
});

if (getDriver()) openDashboard();
</script>
</body>
</html>
