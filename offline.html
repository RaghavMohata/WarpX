<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#6D28D9">
<title>WarpX — you're offline</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section class="section">
  <div class="container" style="max-width:460px;text-align:center;padding-top:40px;">
    <div style="font-size:3rem;margin-bottom:12px;">📡</div>
    <h1 style="font-size:1.6rem;">No connection</h1>
    <p class="text-muted">WarpX can't reach the internet right now. Pages you've already opened still work — anything that needs live data (placing an order, checking a delivery) will need signal.</p>
    <button class="btn btn-primary" onclick="location.reload()">Try again</button>
    <p style="margin-top:20px;"><a href="/" class="btn btn-ghost">Back to home</a></p>
  </div>
</section>
</body>
</html>
